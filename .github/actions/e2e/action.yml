name: Run the e2e specs
description: The Playwright specs and the Edit v3 fixtures against the built pages in dist/ and a debug ips-server built here. The caller sets up Node (setup-node-deps) and dist/ first.

inputs:
  commands:
    description: 'The commands to run, a JSON array (the CI plan chooses them). Empty: the whole e2e and one-editor suites'
    default: ""
  save-cache:
    description: Save the Rust cache ("false" where nothing else can restore it, as under a release tag)
    default: "true"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
    # A warm cache makes this build seconds, so no binary changes hands between jobs.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: src-tauri
        shared-key: native
        save-if: ${{ inputs.save-cache == 'true' }}
    - shell: bash
      run: cargo build -p ips-server
      working-directory: src-tauri
    - uses: ./.github/actions/playwright-install
    # Default: the e2e specs, then the Edit v3 fixtures (src/dev/fixtures; the project builds its own fixtures build).
    - shell: bash
      env:
        COMMANDS: ${{ inputs.commands }}
      run: node tools/ci/run-commands.mjs
