name: CI

# PRs run the checks their change needs. `plan` asks tools/verify.mjs (tests/feature-map.json) which checks the changed
# files call for and the jobs below run or skip accordingly; `ci-ok` is the one required status check. The browser
# checks (e2e specs, overflow) are slow, so a PR runs only those `verify` maps to its files; the label ci:e2e runs them
# all, ci:full runs every job. The release runs them before it publishes (release.yml) and the nightly every night. A
# push to main runs only when the dependencies or the Rust code change, and then only the jobs that save the Rust and npm caches (GitHub shares caches saved on main with
# every PR): every change already passed this check in its PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - package-lock.json
      - src-tauri/**
      - tools/desktop-prepare.mjs
      - .github/workflows/ci.yml
      - .github/actions/**

permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress. A push to main never cancels one: a cancelled run
# skips the cache save that every PR restores.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs the change needs (tools/ci/plan-outputs.mjs). ci:full turns every one on, ci:e2e runs the whole browser
  # checks, a push to main runs the cache-saving ones.
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.plan.outputs.lint }}
      typecheck: ${{ steps.plan.outputs.typecheck }}
      unit: ${{ steps.plan.outputs.unit }}
      build: ${{ steps.plan.outputs.build }}
      budgets: ${{ steps.plan.outputs.budgets }}
      settings: ${{ steps.plan.outputs.settings }}
      server: ${{ steps.plan.outputs.server }}
      e2e: ${{ steps.plan.outputs.e2e }}
      e2e_cmds: ${{ steps.plan.outputs.e2e_cmds }}
      ui_usage: ${{ steps.plan.outputs.ui_usage }}
      pack_budgets: ${{ steps.plan.outputs.pack_budgets }}
      flake_e2e: ${{ steps.plan.outputs.flake_e2e }}
      flake_e2e_cmds: ${{ steps.plan.outputs.flake_e2e_cmds }}
      flake_unit: ${{ steps.plan.outputs.flake_unit }}
      flake_unit_cmds: ${{ steps.plan.outputs.flake_unit_cmds }}
      quarantine: ${{ steps.plan.outputs.quarantine }}
      lab: ${{ steps.plan.outputs.lab }}
      rust: ${{ steps.plan.outputs.rust }}
      windows: ${{ steps.plan.outputs.windows }}
      actionlint: ${{ steps.plan.outputs.actionlint }}
      full: ${{ steps.plan.outputs.full }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
    steps:
      # Full history: the plan diffs against the merge base with the PR's base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          E2E_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:e2e') }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo '{"mode":"full","steps":[]}' | node tools/ci/plan-outputs.mjs --warm
          elif [ "$FULL_LABEL" = "true" ]; then
            echo '{"mode":"full","steps":[]}' | node tools/ci/plan-outputs.mjs --all
          else
            node tools/verify.mjs --plan --json --base "origin/$BASE" > "$RUNNER_TEMP/plan.json"
            # No merge base (a shallow clone) makes verify plan the full suite: say so instead of running it silently.
            node -e 'if (!JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).base) console.log("::warning::the plan found no merge base with origin/" + process.argv[2] + ", so it runs every check")' "$RUNNER_TEMP/plan.json" "$BASE"
            if [ "$E2E_LABEL" = "true" ]; then e2e=--e2e; else e2e=; fi
            node tools/ci/plan-outputs.mjs $e2e < "$RUNNER_TEMP/plan.json"
          fi

  lint:
    needs: plan
    if: needs.plan.outputs.lint == 'true' || needs.plan.outputs.actionlint == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      # Biome lint (biome.json); the formatter is off until a one-off format commit.
      - if: needs.plan.outputs.lint == 'true'
        run: npx biome ci
      # The workflows themselves: a pinned actionlint (tools/ci/actionlint.mjs), cached so a GitHub release outage
      # can't fail lint once the binary has been downloaded.
      - if: needs.plan.outputs.actionlint == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/actionlint
          key: actionlint-${{ runner.os }}-${{ hashFiles('tools/ci/actionlint.mjs') }}
      - if: needs.plan.outputs.actionlint == 'true'
        run: node tools/ci/actionlint.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # tsc -b, the kiosk and studio build, the Settings window build and the gating bundle budgets.
  typecheck-build:
    needs: plan
    if: needs.plan.outputs.typecheck == 'true' || needs.plan.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - if: needs.plan.outputs.build != 'true'
        run: npx tsc -b
      - if: needs.plan.outputs.build == 'true'
        run: npm run build
      - if: needs.plan.outputs.settings == 'true'
        run: npm run desktop:settings
      # The deterministic bundle budgets (tools/perf/budgets.json); CPU and memory stay report-only.
      - if: needs.plan.outputs.budgets == 'true'
        run: npm run perf:budgets
      # The built-in packs' budgets and the --ui-* tokens the settings, help and touch pages read (the map's pack-budgets
      # and ui-usage checks): both read the build above, under a second each.
      - if: needs.plan.outputs.pack_budgets == 'true'
        run: node tools/perf/check-budgets.mjs --packs
      - if: needs.plan.outputs.ui_usage == 'true'
        run: node tools/looks/generate.mjs --check-usage
      - if: needs.plan.outputs.e2e == 'true' || needs.plan.outputs.flake_e2e == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1

  # The whole Vitest suite, whatever the change: the selective runs are local, CI is the complete backstop. Two shards
  # (the matrix is one `unit` result to ci-ok): the suite is 100 to 140 s on a 4-core runner.
  unit:
    needs: plan
    if: needs.plan.outputs.unit == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - run: npm test -- --shard=${{ matrix.shard }}/2

  # The new-test gate (tools/ci/flake-gate.mjs, docs/TESTING.md): a Vitest file added or changed on the branch passes 10
  # shuffled runs. The specs' gate runs in `e2e`, where the build and the server are.
  flake-unit:
    needs: plan
    if: needs.plan.outputs.flake_unit == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - env:
          COMMANDS: ${{ needs.plan.outputs.flake_unit_cmds }}
        run: node tools/ci/run-commands.mjs

  # The import lab: its typecheck and its tests (the InfoPanel corpus round-trips).
  lab:
    needs: plan
    if: needs.plan.outputs.lab == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - run: npm run lab:typecheck
      - run: npm run lab:test

  # The dashboard server on Linux: the HTTP suite against ips-server and the Rust tests and clippy of ips-server and
  # ips-agent. Windows runs the same Rust tests in `rust`.
  server:
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      # Its own key: the tauri cache belongs to the rust job and the release.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: native
      - run: npm run test:server
      - name: cargo test
        run: cargo test -p ips-server -p ips-agent
        working-directory: src-tauri
      - name: cargo clippy
        run: cargo clippy -p ips-server -p ips-agent --all-targets -- -D warnings
        working-directory: src-tauri

  # The browser checks the plan lists for the change (e2e specs, Edit v3 fixtures, the overflow probe), scoped as `verify`
  # scopes them, or all of them with ci:e2e or ci:full: against the built pages (artifact from typecheck-build), in the
  # shared action release.yml runs too.
  e2e:
    needs: [plan, typecheck-build]
    if: needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-26.04
    # A full plan (tooling change, ci:full) measured in run 42460790140: 12.8 min of specs + 1.6 min one-editor, then overflow
    # (about 2 min) and about 3 min of setup, so about 20 min; 40 is twice that, for a slower runner. The gate has its own job.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: ./.github/actions/e2e
        with:
          commands: ${{ needs.plan.outputs.e2e_cmds }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: .cache/playwright
          retention-days: 7

  # Advisory, never in ci-ok: the tests in tests/quarantine.json keep running here (docs/TESTING.md, "Quarantine"). It only
  # exists while something is quarantined.
  quarantine:
    needs: plan
    if: needs.plan.outputs.quarantine == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - run: npm run build
      - uses: ./.github/actions/e2e
        with:
          commands: '["node tools/ci/quarantine.mjs run"]'

  # The new-test gate for Playwright specs (tools/ci/flake-gate.mjs): the specs a branch adds or changes, repeated 3 times
  # on half the runner's cores. Its own job: it must not share the e2e job's time or CPU (4 workers on 4 vCPUs starved the
  # whole-page measure specs in run 42460790140).
  flake-e2e:
    needs: [plan, typecheck-build]
    if: needs.plan.outputs.flake_e2e == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: ./.github/actions/e2e
        with:
          commands: ${{ needs.plan.outputs.flake_e2e_cmds }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-e2e-report
          path: .cache/playwright
          retention-days: 7

  # Windows: the Rust tests and clippy of ips-server and ips-agent (the server leg that used to be a matrix entry), and
  # when the app crate is in play, the Tauri app's. tools/ci-stub-desktop.mjs stands in for the web build, the Node
  # download and the release agent build of `npm run desktop:prepare`: only tauri-build's resource checks need them.
  rust:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      # shared-key: the release job reuses this cache (its key would otherwise include the job name).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: tauri
      - name: cargo test (server, agent)
        run: cargo test -p ips-server -p ips-agent
        working-directory: src-tauri
      # The workspace clippy below covers these when the app crate is in play.
      - if: needs.plan.outputs.rust != 'true'
        name: cargo clippy (server, agent)
        run: cargo clippy -p ips-server -p ips-agent --all-targets -- -D warnings
        working-directory: src-tauri
      # The agent is built by the tests above; the stub copies it, so tauri-build does not leave an empty file over it.
      - if: needs.plan.outputs.rust == 'true'
        run: node tools/ci-stub-desktop.mjs
      - if: needs.plan.outputs.rust == 'true'
        name: cargo test (app)
        run: cargo test
        working-directory: src-tauri
      - if: needs.plan.outputs.rust == 'true'
        name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src-tauri

  # The one required status check. Skipped jobs (not needed for this change) pass; a failed or cancelled one fails it.
  # A run cancelled as a whole (a newer push or label superseded it) reports nothing, so its stale failure can't block
  # the PR next to the newer run's result.
  ci-ok:
    if: ${{ !cancelled() }}
    needs: [plan, lint, typecheck-build, unit, flake-unit, lab, server, e2e, flake-e2e, rust]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::a needed job failed or was cancelled"; exit 1 ;;
          esac
