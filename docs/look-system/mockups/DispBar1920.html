<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Gaming page at 1920 by 550</title>
<!-- Static export of canvas board DispBar1920.dc.html (1920x550). Reference only: production packs bundle fonts locally. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Barlow Condensed',system-ui,sans-serif}
a{color:#1A1C21}a:hover{color:#000}
.fk-card{position:relative;background:#EFE8D8;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-height:0;min-width:0;box-shadow:0 0 0 1px #2A2D33}
.fk-tab{display:flex;justify-content:space-between;align-items:center;background:#1A1C21;color:#EFE8D8;padding:6px 12px;font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.fk-tab span{color:#A8A296;font-weight:500}
.fk-num{font-weight:700;color:#1A1C21;font-variant-numeric:tabular-nums;line-height:1}
.fk-unit{font-size:.5em;font-weight:600;color:#5E5A52;margin-left:2px}
.fk-label{font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#5E5A52}
.fk-track{position:relative;height:10px;background:#D3C9B3;flex:1}
.fk-track i{position:absolute;left:0;top:0;bottom:0;background:#1A1C21}
.fk-seg{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,#EFE8D8 9px 12px)}
.fk-ch{display:flex;flex-direction:column;gap:6px;min-width:0}
</style>
<style>html,body{margin:0;background:#1e1e1e}</style>
</head>
<body>
<div style="width:1920px;height:550px;position:relative;overflow:hidden;background:radial-gradient(120% 120% at 60% 40%,#22252B 0%,#121418 60%,#0B0C0E 100%);box-sizing:border-box">
  <svg aria-hidden="true" width="1920" height="550" viewBox="0 0 1920 550" style="position:absolute;inset:0;opacity:.14"><g fill="none" stroke="#C9B48A" stroke-width="1.2" transform="rotate(-10 1300 275)"><ellipse cx="1300" cy="275" rx="200" ry="110"></ellipse><ellipse cx="1310" cy="280" rx="320" ry="180"></ellipse><ellipse cx="1320" cy="285" rx="460" ry="260"></ellipse><ellipse cx="1330" cy="290" rx="620" ry="350"></ellipse></g></svg>
  <div aria-hidden="true" style="position:absolute;left:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(-45deg,#F2C230 0 10px,#1A1C21 10px 20px)"></div>
  <div style="position:absolute;inset:0;padding:12px 20px 18px 30px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;gap:20px;align-items:center;height:20px;font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#EFE8D8">
      <span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;background:#F2C230;display:inline-block"></span>Field Kit · Gaming</span><span style="color:#A8A296">In match</span>
    </div>
    <div style="flex:1;display:grid;grid-template-columns:repeat(16,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:12px;min-height:0">
      <div class="fk-card" style="grid-column:1 / span 3;grid-row:1 / span 4">
        <div class="fk-tab">FPS <span>cap 144</span></div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:10px 16px">
          <div class="fk-num" style="font-size:130px;font-weight:800">144</div>
          <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px">
            <div style="background:#1A1C21;border-radius:3px;padding:6px 8px"><div class="fk-label" style="color:#A8A296">Avg</div><div class="fk-num" style="font-size:24px;color:#EFE8D8">141</div></div>
            <div style="background:#1A1C21;border-radius:3px;padding:6px 8px"><div class="fk-label" style="color:#A8A296">1%</div><div class="fk-num" style="font-size:24px;color:#EFE8D8">112</div></div>
            <div style="background:#1A1C21;border-radius:3px;padding:6px 8px"><div class="fk-label" style="color:#A8A296">0.1%</div><div class="fk-num" style="font-size:24px;color:#F2C230">96</div></div>
          </div>
        </div>
      </div>
      <div class="fk-card" style="grid-column:4 / span 6;grid-row:1 / span 2">
        <div class="fk-tab">Frame time <span>budget 6.9 ms · p99 9.8</span></div>
        <div style="flex:1;display:flex;gap:16px;padding:8px 14px;min-height:0">
          <div style="display:flex;flex-direction:column;justify-content:center;gap:4px;flex:none"><div class="fk-num" style="font-size:44px">7.1<span class="fk-unit">ms</span></div><div class="fk-label" style="color:#A8340F">2 spikes</div></div>
          <svg viewBox="0 0 560 120" preserveAspectRatio="none" width="100%" height="100%" role="img" aria-label="Frame time with two spikes above budget" style="flex:1;min-width:0">
            <line x1="0" y1="85.2" x2="560" y2="85.2" stroke="#A8340F" stroke-width="1.5" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"></line>
            <polyline points="0.0,84.0 14.4,85.2 28.7,82.8 43.1,86.4 57.4,81.6 71.8,84.0 86.2,85.2 100.5,79.2 114.9,82.8 129.2,86.4 143.6,84.0 157.9,50.4 172.3,80.4 186.7,85.2 201.0,84.0 215.4,82.8 229.7,86.4 244.1,84.0 258.5,81.6 272.8,85.2 287.2,84.0 301.5,82.8 315.9,28.8 330.3,79.2 344.6,84.0 359.0,85.2 373.3,82.8 387.7,84.0 402.1,86.4 416.4,81.6 430.8,84.0 445.1,82.8 459.5,85.2 473.8,84.0 488.2,67.2 502.6,81.6 516.9,84.0 531.3,85.2 545.6,82.8 560.0,84.0" fill="none" stroke="#1A1C21" stroke-width="2" vector-effect="non-scaling-stroke"></polyline>
            <circle cx="157.9" cy="50.4" r="5" fill="#A8340F"></circle><circle cx="315.9" cy="28.8" r="5" fill="#A8340F"></circle>
          </svg>
        </div>
      </div>
      <div class="fk-card" style="grid-column:4 / span 6;grid-row:3 / span 2">
        <div class="fk-tab">Mixer <span>strip shape · headset</span></div>
        <div style="flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:center;padding:8px 14px">
          <div class="fk-ch"><div style="display:flex;justify-content:space-between"><span class="fk-label" style="color:#1A1C21">Game</span><span class="fk-num" style="font-size:18px">78</span></div><div class="fk-track" role="slider" aria-label="Game volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="78" tabindex="0"><i style="width:78%"></i></div><div class="fk-track" style="height:5px" role="meter" aria-label="Game level" aria-valuemin="-60" aria-valuemax="0" aria-valuenow="-12"><i style="width:80%;background:#3E7D55"></i><div class="fk-seg"></div></div></div>
          <div class="fk-ch"><div style="display:flex;justify-content:space-between"><span class="fk-label" style="color:#1A1C21">Chat</span><span class="fk-num" style="font-size:18px">62</span></div><div class="fk-track" role="slider" aria-label="Chat volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62" tabindex="0"><i style="width:62%"></i></div><div class="fk-track" style="height:5px" role="meter" aria-label="Chat level" aria-valuemin="-60" aria-valuemax="0" aria-valuenow="-18"><i style="width:70%;background:#3E7D55"></i><div class="fk-seg"></div></div></div>
          <div class="fk-ch"><div style="display:flex;justify-content:space-between"><span class="fk-label" style="color:#1A1C21">Music</span><span class="fk-num" style="font-size:18px">35</span></div><div class="fk-track" role="slider" aria-label="Music volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35" tabindex="0"><i style="width:35%"></i></div><div class="fk-track" style="height:5px" role="meter" aria-label="Music level" aria-valuemin="-60" aria-valuemax="0" aria-valuenow="-24"><i style="width:60%;background:#3E7D55"></i><div class="fk-seg"></div></div></div>
          <div class="fk-ch"><div style="display:flex;justify-content:space-between"><span class="fk-label" style="color:#A8340F">● Mic</span><span class="fk-num" style="font-size:18px">70</span></div><div class="fk-track" role="slider" aria-label="Mic volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" tabindex="0"><i style="width:70%;background:#A8340F"></i></div><div class="fk-track" style="height:5px" role="meter" aria-label="Mic level" aria-valuemin="-60" aria-valuemax="0" aria-valuenow="-9"><i style="width:86%;background:#C2410C"></i><div class="fk-seg"></div></div></div>
          <div class="fk-ch" style="opacity:.7"><div style="display:flex;justify-content:space-between"><span class="fk-label" style="color:#1A1C21">System</span><span class="fk-label" style="color:#A8340F">Muted</span></div><div class="fk-track" role="slider" aria-label="System volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" tabindex="0"><i style="width:50%;background:#8C8578"></i></div><div class="fk-track" style="height:5px"></div></div>
        </div>
      </div>
      <div class="fk-card" style="grid-column:10 / span 3;grid-row:1 / span 4">
        <div class="fk-tab">Thermals <span>column</span></div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:space-around;padding:10px 16px">
          <div><div class="fk-label">GPU</div><div class="fk-num" style="font-size:56px;color:#A8340F">72<span class="fk-unit" style="color:#A8340F">°C</span></div><div class="fk-track" style="flex:none;margin-top:6px"><i style="width:72%;background:#A8340F"></i><div class="fk-seg"></div></div></div>
          <div><div class="fk-label">CPU</div><div class="fk-num" style="font-size:56px">61<span class="fk-unit">°C</span></div><div class="fk-track" style="flex:none;margin-top:6px"><i style="width:61%"></i><div class="fk-seg"></div></div></div>
          <div style="display:flex;justify-content:space-between"><span class="fk-label">Power</span><span class="fk-num" style="font-size:22px">286<span class="fk-unit">W</span></span></div>
        </div>
      </div>
      <div class="fk-card" style="grid-column:13 / span 2;grid-row:1 / span 2">
        <div class="fk-tab">Ping</div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:6px 12px"><div class="fk-num" style="font-size:48px">18<span class="fk-unit">ms</span></div><div class="fk-label">jitter 2 · loss 0%</div></div>
      </div>
      <div class="fk-card" style="grid-column:13 / span 2;grid-row:3 / span 2">
        <div class="fk-tab">Load</div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:6px 12px">
          <div style="display:flex;align-items:center;gap:8px"><span class="fk-label" style="width:28px;color:#1A1C21">GPU</span><div class="fk-track"><i style="width:67%"></i><div class="fk-seg"></div></div><span class="fk-num" style="font-size:16px">67</span></div>
          <div style="display:flex;align-items:center;gap:8px"><span class="fk-label" style="width:28px;color:#1A1C21">CPU</span><div class="fk-track"><i style="width:42%"></i><div class="fk-seg"></div></div><span class="fk-num" style="font-size:16px">42</span></div>
        </div>
      </div>
      <div class="fk-card" style="grid-column:15 / span 2;grid-row:1 / span 4;background:#1A1C21">
        <div class="fk-tab" style="background:#F2C230;color:#1A1C21">Time</div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px">
          <div class="fk-num" style="font-size:96px;color:#EFE8D8;font-weight:800">22</div>
          <div class="fk-num" style="font-size:96px;color:#EFE8D8;font-weight:800">28</div>
          <div class="fk-label" style="color:#A8A296;margin-top:10px">Tue 03 Nov</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
