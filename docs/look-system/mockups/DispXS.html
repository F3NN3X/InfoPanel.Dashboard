<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=480">
<title>Gaming page at 480 by 320</title>
<!-- Static export of canvas board DispXS.dc.html (480x320). Reference only: production packs bundle fonts locally. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Barlow Condensed',system-ui,sans-serif}
a{color:#1A1C21}a:hover{color:#000}
.fk-card{position:relative;background:#EFE8D8;border-radius:5px;overflow:hidden;display:flex;flex-direction:column;min-height:0;min-width:0}
.fk-tab{display:flex;justify-content:space-between;align-items:center;background:#1A1C21;color:#EFE8D8;padding:4px 9px;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.fk-tab span{color:#A8A296;font-weight:500}
.fk-num{font-weight:700;color:#1A1C21;font-variant-numeric:tabular-nums;line-height:1}
.fk-unit{font-size:.5em;font-weight:600;color:#5E5A52;margin-left:2px}
.fk-label{font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#5E5A52}
</style>
<style>html,body{margin:0;background:#1e1e1e}</style>
</head>
<body>
<div style="width:480px;height:320px;box-sizing:border-box;background:#121418;padding:8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px">
  <div class="fk-card" style="grid-column:span 2;grid-row:span 2">
    <div class="fk-tab">FPS <span>cap 144</span></div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:8px 12px">
      <div class="fk-num" style="font-size:96px;font-weight:800">144</div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px">
        <div style="background:#1A1C21;border-radius:3px;padding:5px 8px"><div class="fk-label" style="color:#A8A296">1% low</div><div class="fk-num" style="font-size:22px;color:#EFE8D8">112</div></div>
        <div style="background:#1A1C21;border-radius:3px;padding:5px 8px"><div class="fk-label" style="color:#A8A296">0.1%</div><div class="fk-num" style="font-size:22px;color:#F2C230">96</div></div>
      </div>
    </div>
  </div>
  <div class="fk-card" style="grid-column:span 2">
    <div class="fk-tab">Frame time <span>7.1 ms</span></div>
    <div style="flex:1;padding:6px 8px;display:flex;flex-direction:column;min-height:0">
      <svg viewBox="0 0 560 120" preserveAspectRatio="none" width="100%" height="100%" role="img" aria-label="Frame time with two spikes above the 6.9 millisecond budget" style="flex:1">
        <line x1="0" y1="85.2" x2="560" y2="85.2" stroke="#A8340F" stroke-width="1.5" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"></line>
        <polyline points="0.0,84.0 14.4,85.2 28.7,82.8 43.1,86.4 57.4,81.6 71.8,84.0 86.2,85.2 100.5,79.2 114.9,82.8 129.2,86.4 143.6,84.0 157.9,50.4 172.3,80.4 186.7,85.2 201.0,84.0 215.4,82.8 229.7,86.4 244.1,84.0 258.5,81.6 272.8,85.2 287.2,84.0 301.5,82.8 315.9,28.8 330.3,79.2 344.6,84.0 359.0,85.2 373.3,82.8 387.7,84.0 402.1,86.4 416.4,81.6 430.8,84.0 445.1,82.8 459.5,85.2 473.8,84.0 488.2,67.2 502.6,81.6 516.9,84.0 531.3,85.2 545.6,82.8 560.0,84.0" fill="none" stroke="#1A1C21" stroke-width="2" vector-effect="non-scaling-stroke"></polyline>
      </svg>
      <div class="fk-label" style="color:#A8340F">2 spikes · budget 6.9</div>
    </div>
  </div>
  <div class="fk-card">
    <div class="fk-tab">GPU</div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:4px 10px;gap:4px">
      <div class="fk-num" style="font-size:38px;color:#A8340F">72<span class="fk-unit" style="color:#A8340F">°C</span></div>
      <div class="fk-label">Load 67%</div>
    </div>
  </div>
  <div class="fk-card">
    <div class="fk-tab">Ping</div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:4px 10px;gap:4px">
      <div class="fk-num" style="font-size:38px">18<span class="fk-unit">ms</span></div>
      <div class="fk-label">Loss 0.0%</div>
    </div>
  </div>
</div>
</body>
</html>
